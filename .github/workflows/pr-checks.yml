name: Pull request checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Docs-only changes run no code checks. Docs Source validates
    # packages/docs on push to main.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'packages/docs/**'
      - '.agents/**'

# A new push to a pull request cancels the run for its previous commit.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-compatibility:
    uses: ./.github/workflows/runtime-smoke.yml

  # Each check gets its own runner. None of them read another's output, so
  # the run takes as long as the slowest check instead of their sum.
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build
            run: bun run build
          - name: type-check and lint
            run: bun run type-check && bun run lint
          - name: web and electron tests
            run: bun run test:web && bun run test:electron
          - name: ui tests
            run: bun run test:ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
