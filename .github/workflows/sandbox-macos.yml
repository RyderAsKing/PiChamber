name: Sandbox (macOS)

# Runs the real-nono sandbox e2e test under Seatbelt. Linux CI has no
# Landlock, so the Linux and WSL2 paths are run by hand on a Landlock host
# (packages/web/server/lib/pi/sandbox/DOCUMENTATION.md, Tests).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/web/server/lib/pi/sandbox/**'
      - 'packages/web/server/lib/pi/session-daemon/**'
      - '.github/workflows/sandbox-macos.yml'
  workflow_dispatch:

concurrency:
  group: sandbox-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nono-e2e:
    name: nono e2e on macOS
    runs-on: macos-15
    timeout-minutes: 20
    env:
      NONO_VERSION: '0.82.0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install nono
        run: |
          set -euo pipefail
          asset="nono-v${NONO_VERSION}-aarch64-apple-darwin.tar.gz"
          base="https://github.com/always-further/nono/releases/download/v${NONO_VERSION}"
          work="$(mktemp -d)"
          curl -fsSL -o "$work/$asset" "$base/$asset"
          curl -fsSL -o "$work/SHA256SUMS.txt" "$base/SHA256SUMS.txt"
          (cd "$work" && grep " ${asset}\$" SHA256SUMS.txt | shasum -a 256 -c -)
          mkdir -p "$work/x" "$HOME/.local/bin"
          tar -xzf "$work/$asset" -C "$work/x"
          install -m 755 "$work/x/nono" "$HOME/.local/bin/nono"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nono" --version
          "$HOME/.local/bin/nono" setup --check-only

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the nono e2e test
        working-directory: packages/web
        env:
          # Fail instead of skipping when nono cannot sandbox on the runner.
          PICHAMBER_REQUIRE_NONO_E2E: '1'
        run: bunx vitest run server/lib/pi/session-daemon/supervisor-sandbox-nono.e2e.test.js
