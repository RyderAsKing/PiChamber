name: Docker image

# Docker CI is intentionally parked until image publishing is ready.
on:
  workflow_dispatch:

jobs:
  build:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build linux/amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: pichamber:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Smoke test container lifecycle and authentication
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f pichamber-smoke pichamber-no-password >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --name pichamber-smoke -d \
            -e PICHAMBER_UI_PASSWORD=ci-smoke-password \
            -p 127.0.0.1:3000:3000 \
            pichamber:pr

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs pichamber-smoke
              exit 1
            fi
            sleep 2
          done

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/config/settings)" = "401"
          for attempt in {1..20}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' pichamber-smoke)"
            [ "$status" = "healthy" ] && break
            if [ "$status" = "unhealthy" ] || [ "$attempt" -eq 20 ]; then
              docker inspect pichamber-smoke
              docker logs pichamber-smoke
              exit 1
            fi
            sleep 2
          done
          timeout 15 docker stop --time 10 pichamber-smoke >/dev/null

          docker run --name pichamber-no-password pichamber:pr >/tmp/pichamber-no-password.log 2>&1 && exit 1
          grep -q 'PICHAMBER_UI_PASSWORD is required' /tmp/pichamber-no-password.log
