name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.9.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip publishing)'
        required: false
        default: false
        type: boolean
      publish_npm:
        description: 'Also publish @pi-chamber/web to npm (off for desktop-only releases)'
        required: false
        default: false
        type: boolean
      publish_mobile:
        description: 'Also build and upload mobile artifacts (Android APK is always built on version tags)'
        required: false
        default: true
        type: boolean

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

permissions:
  contents: write

jobs:
  runtime-compatibility:
    uses: ./.github/workflows/runtime-smoke.yml

  create-release:
    needs: runtime-compatibility
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
      release_channel: ${{ steps.get_version.outputs.release_channel }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Get version
        id: get_version
        env:
          RELEASE_INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_INPUT_VERSION" ]]; then
            VERSION="$RELEASE_INPUT_VERSION"
          elif [[ "$RELEASE_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            echo "Unable to resolve a release version." >&2
            exit 1
          fi

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_PRERELEASE=false
            RELEASE_CHANNEL=stable
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]; then
            IS_PRERELEASE=true
            RELEASE_CHANNEL=rc
          else
            echo "Version must be X.Y.Z or X.Y.Z-rc.N with N >= 1; found: $VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "release_channel=$RELEASE_CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Verify stable website refresh configuration
        if: ${{ github.event.inputs.dry_run != 'true' && steps.get_version.outputs.is_prerelease != 'true' }}
        env:
          WEBSITE_TOKEN: ${{ secrets.PICHAMBER_WEBSITE_REPO_TOKEN }}
        run: |
          if [ -z "$WEBSITE_TOKEN" ]; then
            echo "PICHAMBER_WEBSITE_REPO_TOKEN is required for stable releases." >&2
            exit 1
          fi

      - name: Extract changelog for release
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const changelogPath = 'CHANGELOG.md';
          if (!fs.existsSync(changelogPath)) {
            throw new Error('CHANGELOG.md not found; add it before releasing.');
          }
          const changelog = fs.readFileSync(changelogPath, 'utf8');
          const sections = changelog.split(/^## /m);
          const section = sections.find(s => s.startsWith('[' + version + ']'));
          if (!section) {
            throw new Error('Changelog section [' + version + '] not found. Add a section like "## [' + version + '] - YYYY-MM-DD".');
          }
          const content = ('## ' + section).trim();
          fs.mkdirSync('artifacts', { recursive: true });
          fs.writeFileSync('artifacts/release-notes.md', content + '\n');
          NODE

      - name: Create draft GitHub Release when absent
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
          IS_PRERELEASE: ${{ steps.get_version.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving its current draft/public state for repair."
            exit 0
          fi
          args=(
            "$tag"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "PiChamber $tag"
            --notes-file artifacts/release-notes.md
            --draft
          )
          if [ "$IS_PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"

  publish-npm:
    needs: create-release
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_npm == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release versions
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifests = [
            'package.json',
            'packages/ui/package.json',
            'packages/web/package.json',
            'packages/electron/package.json',
          ];
          const mismatches = manifests.flatMap((manifest) => {
            const actual = JSON.parse(fs.readFileSync(manifest, 'utf8')).version;
            return actual === process.env.VERSION ? [] : [`${manifest}: expected ${process.env.VERSION}, found ${actual}`];
          });
          if (mismatches.length > 0) {
            throw new Error(`Release version mismatch:\n${mismatches.join('\n')}`);
          }
          NODE

      - name: Build packages
        run: bun run build

      - name: Create npm tarball
        id: npm_pack
        working-directory: packages/web
        run: |
          set -euo pipefail
          npm pack --json > "$RUNNER_TEMP/npm-pack.json"
          TARBALL=$(node -e "const result = require(process.env.RUNNER_TEMP + '/npm-pack.json'); if (result.length !== 1 || !result[0].filename) process.exit(1); process.stdout.write(result[0].filename)")
          test -f "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Publish exact npm tarball
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: packages/web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          IS_PRERELEASE: ${{ needs.create-release.outputs.is_prerelease }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          if npm view "@pi-chamber/web@${VERSION}" version >/dev/null 2>&1; then
            echo "@pi-chamber/web@${VERSION} is already published; skipping publish."
            exit 0
          fi
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            npm publish "${{ steps.npm_pack.outputs.tarball }}" --access public --tag rc
          else
            npm publish "${{ steps.npm_pack.outputs.tarball }}" --access public
          fi

      - name: Verify npm registry tarball integrity
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: packages/web
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          TARBALL: ${{ steps.npm_pack.outputs.tarball }}
        run: |
          node - <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          const packageSpec = `@pi-chamber/web@${process.env.VERSION}`;
          const localBytes = fs.readFileSync(process.env.TARBALL);
          const expectedIntegrity = `sha512-${crypto.createHash('sha512').update(localBytes).digest('base64')}`;
          const expectedShasum = crypto.createHash('sha1').update(localBytes).digest('hex');
          const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

          async function verify() {
            let lastError;
            // npm reports "Your package is being processed and may take a few
            // minutes to become available" after publish, so give the registry
            // a grace period before the first read instead of burning retries.
            await sleep(30_000);
            for (let attempt = 1; attempt <= 30; attempt += 1) {
              try {
                const output = execFileSync('npm', ['view', packageSpec, 'dist', '--json'], { encoding: 'utf8' });
                const dist = JSON.parse(output);
                if (dist.integrity !== expectedIntegrity) {
                  throw new Error(`integrity metadata mismatch: expected ${expectedIntegrity}, found ${dist.integrity}`);
                }
                if (dist.shasum !== expectedShasum) {
                  throw new Error(`shasum metadata mismatch: expected ${expectedShasum}, found ${dist.shasum}`);
                }

                const response = await fetch(dist.tarball);
                if (!response.ok) throw new Error(`registry tarball returned HTTP ${response.status}`);
                const registryBytes = Buffer.from(await response.arrayBuffer());
                const registryIntegrity = `sha512-${crypto.createHash('sha512').update(registryBytes).digest('base64')}`;
                if (registryIntegrity !== expectedIntegrity) {
                  throw new Error(`registry tarball mismatch: expected ${expectedIntegrity}, found ${registryIntegrity}`);
                }

                console.log(`Verified ${packageSpec}: release asset, npm metadata, and registry tarball use ${expectedIntegrity}`);
                return;
              } catch (error) {
                lastError = error;
                console.log(`Integrity check ${attempt}/30 is not ready: ${error.message}`);
                if (attempt < 30) await sleep(20_000);
              }
            }
            throw lastError;
          }

          verify().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload verified npm tarball to release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: packages/web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          TARBALL: ${{ steps.npm_pack.outputs.tarball }}
        run: |
          set -euo pipefail
          name=$(basename "$TARBALL")
          local_size=$(stat -c %s "$TARBALL")
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"v${VERSION}\") | .id")
          for attempt in 1 2 3; do
            record=$(gh api "repos/$GITHUB_REPOSITORY/releases/${release_id}" \
              --jq ".assets[] | select(.name == \"$name\") | [.id, .size] | @tsv" || true)
            if [ -n "$record" ]; then
              asset_id=${record%%$'\t'*}
              remote_size=${record#*$'\t'}
              if [ "$remote_size" = "$local_size" ]; then
                echo "$name is already uploaded with the expected size."
                exit 0
              fi
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            fi
            echo "Uploading $name through the GitHub asset endpoint (attempt $attempt/3)"
            if curl --http1.1 --fail-with-body --silent --show-error \
              --connect-timeout 30 --max-time 900 \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$TARBALL" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$name" \
              --output /dev/null; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          echo "Failed to upload $TARBALL after 3 bounded attempts." >&2
          exit 1

  publish-docker:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set image name
        id: image
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/pichamber" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.create-release.outputs.version }}
            type=raw,value=latest,enable=${{ needs.create-release.outputs.is_prerelease != 'true' }}
            type=raw,value=rc,enable=${{ needs.create-release.outputs.is_prerelease == 'true' }}
          labels: |
            org.opencontainers.image.title=PiChamber
            org.opencontainers.image.description=PiChamber server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.create-release.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.dry_run != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  build-desktop-electron-macos:
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            platform: darwin-aarch64
            runner: macos-26
          - target: x86_64-apple-darwin
            arch: x64
            platform: darwin-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Apple Certificate
        id: apple_cert
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bash packages/electron/scripts/install-apple-certificate.sh

      - name: Build Electron app
        working-directory: packages/electron
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # rebuild-native.mjs reads this to target the right arch when
          # cross-building (runner is arm64; x64 matrix needs the hint).
          ELECTRON_BUILDER_ARCH: ${{ matrix.arch }}
          MAC_SIGNED: ${{ steps.apple_cert.outputs.signed }}
        run: |
          bun run build:web-assets
          bun run bundle:main
          # npmRebuild=false in package.json, so electron-builder won't
          # recompile native deps on its own — we must rebuild against the
          # target Electron ABI before packaging, otherwise node-pty/bun-pty
          # crash on require inside the packaged app.
          bun run rebuild:native
          if [ "$MAC_SIGNED" = "true" ]; then
            bunx electron-builder --mac --${{ matrix.arch }} --publish=never
          else
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            bunx electron-builder --mac --${{ matrix.arch }} --publish=never \
              -c.mac.identity=null -c.mac.notarize=false
          fi

      - name: Validate macOS update manifest checksum
        working-directory: packages/electron
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          ARTIFACT_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ZIP="dist/PiChamber-${VERSION}-mac-${ARTIFACT_ARCH}.zip"
          node ./scripts/verify-update-manifest.mjs "dist/latest-mac.yml" "$ZIP" "$VERSION"

      - name: Verify signature + entitlements + notarization
        if: ${{ steps.apple_cert.outputs.signed == 'true' }}
        run: |
          set -euo pipefail

          APP_DIR="packages/electron/dist/mac"
          [ -d "packages/electron/dist/mac-arm64" ] && APP_DIR="packages/electron/dist/mac-arm64"

          APP_PATH=$(find "$APP_DIR" -maxdepth 2 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found under packages/electron/dist/mac*"
            ls -la packages/electron/dist/
            exit 1
          fi

          echo "Verifying $APP_PATH"
          codesign -vv --deep --strict "$APP_PATH"

          # Require hardened runtime
          CS_INFO=$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)
          echo "$CS_INFO"
          if ! echo "$CS_INFO" | grep -q "flags=.*runtime"; then
            echo "Error: hardened runtime flag missing"
            exit 1
          fi

          # Require notary ticket stapled
          xcrun stapler validate "$APP_PATH"

          ENTITLEMENTS=$(codesign -d --entitlements :- "$APP_PATH" 2>&1 || true)
          if echo "$ENTITLEMENTS" | grep -q "com.apple.security.app-sandbox"; then
            echo "Error: app sandbox entitlement is present"
            exit 1
          fi
          for key in \
            com.apple.security.cs.allow-jit \
            com.apple.security.cs.allow-unsigned-executable-memory \
            com.apple.security.cs.disable-library-validation
          do
            if ! echo "$ENTITLEMENTS" | grep -q "<key>$key</key>"; then
              echo "Error: required entitlement missing: $key"
              exit 1
            fi
          done

      - name: Save validated macOS release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release-${{ matrix.arch }}
          path: |
            packages/electron/dist/PiChamber-${{ needs.create-release.outputs.version }}-mac-${{ matrix.arch }}.dmg
            packages/electron/dist/PiChamber-${{ needs.create-release.outputs.version }}-mac-${{ matrix.arch }}.dmg.blockmap
            packages/electron/dist/PiChamber-${{ needs.create-release.outputs.version }}-mac-${{ matrix.arch }}.zip
            packages/electron/dist/PiChamber-${{ needs.create-release.outputs.version }}-mac-${{ matrix.arch }}.zip.blockmap
          if-no-files-found: error
          retention-days: 1

      - name: Save per-arch latest-mac.yml for merge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latest-yml-${{ matrix.target }}
          path: packages/electron/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 1

  build-desktop-electron-windows:
    needs: create-release
    # windows-latest currently resolves to a runner with Visual Studio 18,
    # which this electron/node-gyp stack does not detect correctly.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            platform: win32-x64
          - arch: arm64
            target: aarch64-pc-windows-msvc
            platform: win32-arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        working-directory: packages/electron
        run: bun run build:web-assets

      - name: Bundle main process
        working-directory: packages/electron
        run: bun run bundle:main

      - name: Rebuild native modules
        working-directory: packages/electron
        shell: bash
        env:
          # Cross-compile for ARM64 target from x64 runner.
          ELECTRON_BUILDER_ARCH: ${{ matrix.arch }}
        # npmRebuild=false in package.json, so electron-builder won't
        # recompile native deps on its own — we must rebuild against the
        # target Electron ABI before packaging.
        run: node ./scripts/rebuild-native.mjs

      - name: Build Windows app
        working-directory: packages/electron
        shell: bash
        run: |
          node ./scripts/package.mjs --win --${{ matrix.arch }} --publish=never

      - name: Validate Windows update manifest checksum
        working-directory: packages/electron
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          ARTIFACT_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          INSTALLER="dist/PiChamber-${VERSION}-win-${ARTIFACT_ARCH}.exe"
          node ./scripts/verify-update-manifest.mjs "dist/latest.yml" "$INSTALLER" "$VERSION"

      - name: Save validated Windows release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-${{ matrix.arch }}
          path: |
            packages/electron/dist/PiChamber-${{ needs.create-release.outputs.version }}-win-${{ matrix.arch }}.exe
            packages/electron/dist/PiChamber-${{ needs.create-release.outputs.version }}-win-${{ matrix.arch }}.exe.blockmap
          if-no-files-found: error
          retention-days: 1

      - name: Save update manifest for merge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latest-yml-${{ matrix.target }}
          path: packages/electron/dist/latest.yml
          if-no-files-found: error
          retention-days: 1

  build-desktop-electron-linux:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            host_arch: x86_64
            artifact_arch: x86_64
            manifest: latest-linux.yml
          - runner: ubuntu-24.04-arm
            arch: arm64
            host_arch: aarch64
            artifact_arch: arm64
            manifest: latest-linux-arm64.yml
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Verify native Linux architecture
        env:
          EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
          PICHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_HOST_ARCH"
          test "$(node -p 'process.arch')" = "$PICHAMBER_TARGET_ARCH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused Electron release tests
        working-directory: packages/electron
        run: |
          bun run test:architecture
          bun run test:updater

      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y rpm

      - name: Build and package Linux desktop artifacts
        working-directory: packages/electron
        env:
          PICHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bun run build:web-assets
          bun run bundle:main
          bun run rebuild:native
          node ./scripts/package.mjs --linux --${{ matrix.arch }} --publish=never
          bun run verify:linux-appimage

      - name: Validate Linux update manifest
        working-directory: packages/electron
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          set -euo pipefail
          APPIMAGE="dist/PiChamber-${VERSION}-linux-${ARTIFACT_ARCH}.AppImage"
          node ./scripts/verify-update-manifest.mjs "dist/${MANIFEST}" "$APPIMAGE" "$VERSION"
          for artifact in dist/PiChamber-${VERSION}-linux-*.deb dist/PiChamber-${VERSION}-linux-*.rpm; do
            node ./scripts/verify-update-manifest.mjs "dist/${MANIFEST}" "$artifact" "$VERSION"
          done

      - name: Upload validated Linux release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-${{ matrix.arch }}
          path: |
            packages/electron/dist/PiChamber-${{ needs.create-release.outputs.version }}-linux-${{ matrix.artifact_arch }}.AppImage
            packages/electron/dist/*.deb
            packages/electron/dist/*.rpm
            packages/electron/dist/${{ matrix.manifest }}
          if-no-files-found: error
          retention-days: 1

  publish-electron-desktop:
    needs: [create-release, build-desktop-electron-macos, build-desktop-electron-windows, build-desktop-electron-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download macOS release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: macos-release-*
          path: artifacts

      - name: Download Windows release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: windows-release-*
          path: artifacts

      - name: Download per-architecture update manifests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: latest-yml-*
          path: artifacts

      - name: Download x64 Linux release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-release-x64
          path: artifacts/x64

      - name: Download arm64 Linux release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-release-arm64
          path: artifacts/arm64

      - name: Revalidate desktop update manifests
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          node packages/electron/scripts/verify-update-manifest.mjs \
            artifacts/x64/latest-linux.yml \
            "artifacts/x64/PiChamber-${VERSION}-linux-x86_64.AppImage" \
            "$VERSION"
          node packages/electron/scripts/verify-update-manifest.mjs \
            artifacts/arm64/latest-linux-arm64.yml \
            "artifacts/arm64/PiChamber-${VERSION}-linux-arm64.AppImage" \
            "$VERSION"
          node packages/electron/scripts/verify-update-manifest.mjs \
            artifacts/latest-yml-x86_64-apple-darwin/latest-mac.yml \
            "artifacts/macos-release-x64/PiChamber-${VERSION}-mac-x64.zip" \
            "$VERSION"
          node packages/electron/scripts/verify-update-manifest.mjs \
            artifacts/latest-yml-aarch64-apple-darwin/latest-mac.yml \
            "artifacts/macos-release-arm64/PiChamber-${VERSION}-mac-arm64.zip" \
            "$VERSION"
          node packages/electron/scripts/verify-update-manifest.mjs \
            artifacts/latest-yml-x86_64-pc-windows-msvc/latest.yml \
            "artifacts/windows-release-x64/PiChamber-${VERSION}-win-x64.exe" \
            "$VERSION"
          node packages/electron/scripts/verify-update-manifest.mjs \
            artifacts/latest-yml-aarch64-pc-windows-msvc/latest.yml \
            "artifacts/windows-release-arm64/PiChamber-${VERSION}-win-arm64.exe" \
            "$VERSION"

      - name: Finalize combined manifests
        env:
          LATEST_YML_DIR: ${{ github.workspace }}/artifacts
          GH_REPO: ${{ github.repository }}
          PICHAMBER_VERSION: ${{ needs.create-release.outputs.version }}
          PICHAMBER_RELEASE_CHANNEL: ${{ needs.create-release.outputs.release_channel }}
        run: node packages/electron/scripts/finalize-latest-yml.mjs

      - name: Stage complete desktop release inventory
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          IS_PRERELEASE: ${{ needs.create-release.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          mkdir release-assets
          files=(
            "artifacts/macos-release-arm64/PiChamber-${VERSION}-mac-arm64.dmg"
            "artifacts/macos-release-arm64/PiChamber-${VERSION}-mac-arm64.dmg.blockmap"
            "artifacts/macos-release-arm64/PiChamber-${VERSION}-mac-arm64.zip"
            "artifacts/macos-release-arm64/PiChamber-${VERSION}-mac-arm64.zip.blockmap"
            "artifacts/macos-release-x64/PiChamber-${VERSION}-mac-x64.dmg"
            "artifacts/macos-release-x64/PiChamber-${VERSION}-mac-x64.dmg.blockmap"
            "artifacts/macos-release-x64/PiChamber-${VERSION}-mac-x64.zip"
            "artifacts/macos-release-x64/PiChamber-${VERSION}-mac-x64.zip.blockmap"
            "artifacts/windows-release-arm64/PiChamber-${VERSION}-win-arm64.exe"
            "artifacts/windows-release-arm64/PiChamber-${VERSION}-win-arm64.exe.blockmap"
            "artifacts/windows-release-x64/PiChamber-${VERSION}-win-x64.exe"
            "artifacts/windows-release-x64/PiChamber-${VERSION}-win-x64.exe.blockmap"
            "artifacts/x64/PiChamber-${VERSION}-linux-x86_64.AppImage"
            "artifacts/x64/PiChamber-${VERSION}-linux-amd64.deb"
            "artifacts/x64/PiChamber-${VERSION}-linux-x86_64.rpm"
            "artifacts/arm64/PiChamber-${VERSION}-linux-arm64.AppImage"
            "artifacts/arm64/PiChamber-${VERSION}-linux-arm64.deb"
            "artifacts/arm64/PiChamber-${VERSION}-linux-aarch64.rpm"
          )
          if [ "$IS_PRERELEASE" = "true" ]; then
            cp artifacts/x64/latest-linux.yml release-assets/rc-linux.yml
            cp artifacts/arm64/latest-linux-arm64.yml release-assets/rc-linux-arm64.yml
            cp "$RUNNER_TEMP/rc-mac.yml" "$RUNNER_TEMP/rc.yml" release-assets/
          else
            cp artifacts/x64/latest-linux.yml artifacts/arm64/latest-linux-arm64.yml release-assets/
            cp "$RUNNER_TEMP/latest-mac.yml" "$RUNNER_TEMP/latest.yml" "$RUNNER_TEMP/latest-arm64.yml" release-assets/
          fi
          for file in "${files[@]}"; do
            test -s "$file"
            cp "$file" release-assets/
          done
          expected_count=$([ "$IS_PRERELEASE" = "true" ] && echo 22 || echo 23)
          actual_count=$(find release-assets -maxdepth 1 -type f | wc -l)
          test "$actual_count" -eq "$expected_count"
          echo "Staged $actual_count validated desktop release files."

      - name: Upload desktop release files sequentially with retries
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"v${VERSION}\") | .id")
          for file in release-assets/*; do
            name=$(basename "$file")
            local_size=$(stat -c %s "$file")
            uploaded=false
            for attempt in 1 2 3; do
              record=$(gh api "repos/$GITHUB_REPOSITORY/releases/${release_id}" \
                --jq ".assets[] | select(.name == \"$name\") | [.id, .size] | @tsv" || true)
              if [ -n "$record" ]; then
                asset_id=${record%%$'\t'*}
                remote_size=${record#*$'\t'}
                if [ "$remote_size" = "$local_size" ]; then
                  echo "$name is already uploaded with the expected size."
                  uploaded=true
                  break
                fi
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              fi
              echo "Uploading $name through the GitHub asset endpoint (attempt $attempt/3)"
              if curl --http1.1 --fail-with-body --silent --show-error \
                --connect-timeout 30 --max-time 900 \
                -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$file" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$name" \
                --output /dev/null; then
                uploaded=true
                break
              fi
              sleep $((attempt * 20))
            done
            if [ "$uploaded" != "true" ]; then
              echo "Failed to upload $file after 3 bounded attempts." >&2
              exit 1
            fi
          done

  mobile-release:
    needs: create-release
    if: ${{ github.event.inputs.dry_run != 'true' && (github.event_name == 'push' || github.event.inputs.publish_mobile == 'true') }}
    uses: ./.github/workflows/mobile-release.yml
    with:
      version_name: ${{ needs.create-release.outputs.version }}
      build_number: ${{ github.run_number }}
      release_tag: v${{ needs.create-release.outputs.version }}
      upload_github_release: true
      build_android: true
      build_ios: false
    secrets: inherit

  finalize-release:
    needs: [create-release, publish-npm, publish-docker, build-desktop-electron-macos, build-desktop-electron-windows, build-desktop-electron-linux, publish-electron-desktop, mobile-release]
    if: >-
      ${{
        always() &&
        needs.create-release.result == 'success' &&
        (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') &&
        needs.publish-docker.result == 'success' &&
        needs.build-desktop-electron-macos.result == 'success' &&
        needs.build-desktop-electron-windows.result == 'success' &&
        needs.build-desktop-electron-linux.result == 'success' &&
        needs.publish-electron-desktop.result == 'success' &&
        (needs.mobile-release.result == 'success' || needs.mobile-release.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify complete desktop release asset inventory
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          node - <<'NODE'
          (async () => {
          const { REPOSITORY: repo, VERSION: version, GITHUB_TOKEN: token } = process.env;
          const prerelease = version.includes('-rc.');
          const expected = [
            `PiChamber-${version}-mac-arm64.dmg`,
            `PiChamber-${version}-mac-arm64.dmg.blockmap`,
            `PiChamber-${version}-mac-arm64.zip`,
            `PiChamber-${version}-mac-arm64.zip.blockmap`,
            `PiChamber-${version}-mac-x64.dmg`,
            `PiChamber-${version}-mac-x64.dmg.blockmap`,
            `PiChamber-${version}-mac-x64.zip`,
            `PiChamber-${version}-mac-x64.zip.blockmap`,
            `PiChamber-${version}-win-arm64.exe`,
            `PiChamber-${version}-win-arm64.exe.blockmap`,
            `PiChamber-${version}-win-x64.exe`,
            `PiChamber-${version}-win-x64.exe.blockmap`,
            `PiChamber-${version}-linux-x86_64.AppImage`,
            `PiChamber-${version}-linux-amd64.deb`,
            `PiChamber-${version}-linux-x86_64.rpm`,
            `PiChamber-${version}-linux-arm64.AppImage`,
            `PiChamber-${version}-linux-arm64.deb`,
            `PiChamber-${version}-linux-aarch64.rpm`,
            prerelease ? 'rc-linux.yml' : 'latest-linux.yml',
            prerelease ? 'rc-linux-arm64.yml' : 'latest-linux-arm64.yml',
            prerelease ? 'rc-mac.yml' : 'latest-mac.yml',
            prerelease ? 'rc.yml' : 'latest.yml',
            ...(!prerelease ? ['latest-arm64.yml'] : []),
          ];
          const response = await fetch(`https://api.github.com/repos/${repo}/releases?per_page=100`, {
            headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' },
          });
          if (!response.ok) throw new Error(`Failed to list release assets: ${response.status} ${await response.text()}`);
          const releases = await response.json();
          const release = releases.find((candidate) => candidate.tag_name === `v${version}`);
          if (!release) throw new Error(`Release v${version} not found among ${releases.length} releases`);
          for (const name of expected) {
            const matches = release.assets.filter((asset) => asset.name === name);
            if (matches.length !== 1) throw new Error(`Expected exactly one ${name} release asset, found ${matches.length}`);
            if (!Number.isSafeInteger(matches[0].size) || matches[0].size <= 0) {
              throw new Error(`Release asset ${name} has invalid size ${matches[0].size}`);
            }
          }
          console.log(`Verified all ${expected.length} desktop release assets.`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Publish release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: false
          prerelease: ${{ needs.create-release.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.create-release.outputs.is_prerelease == 'true' && 'false' || 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger pichamber-website site refresh (optional)
        if: ${{ github.event.inputs.dry_run != 'true' && needs.create-release.outputs.is_prerelease != 'true' }}
        env:
          WEBSITE_REPO: RyderAsKing/PiChamber-web
          WEBSITE_TOKEN: ${{ secrets.PICHAMBER_WEBSITE_REPO_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $WEBSITE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$WEBSITE_REPO/dispatches" \
            -d @- <<JSON
          {
            "event_type": "site_refresh_requested",
            "client_payload": {
              "source_repo": "${{ github.repository }}",
              "release_tag": "v$VERSION"
            }
          }
          JSON
