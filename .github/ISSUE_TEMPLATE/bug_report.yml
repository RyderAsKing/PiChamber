name: Bug report
description: Report a reproducible problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove passwords, provider keys, pairing links, client tokens, session text, and private file contents from logs and screenshots before posting.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
      placeholder: "I expected … but got …"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest set of steps that shows the problem.
      placeholder: |
        1. Start PiChamber with …
        2. Open …
        3. Select …
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Where does it happen?
      options:
        - Desktop (macOS)
        - Desktop (Windows)
        - Desktop (Linux)
        - Browser connected to a PiChamber server
        - Hosted mobile browser
        - Capacitor mobile app (iOS or Android)
        - PiChamber server or CLI
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PiChamber version
      description: Use the app About page or run `pichamber version` for a server install.
      placeholder: "e.g. 0.9.0"

  - type: input
    id: pi-version
    attributes:
      label: Pi version, if known
      description: Include this when the problem involves Pi behavior or provider setup.
      placeholder: "e.g. 0.84.1"

  - type: input
    id: system
    attributes:
      label: OS, device, and browser
      placeholder: "e.g. macOS 15.6, Apple Silicon, Chrome 140"

  - type: input
    id: install
    attributes:
      label: Installation method
      placeholder: "e.g. GitHub desktop release, npm global install, Bun global install, Docker"

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Add visual evidence when it helps explain the problem.

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant redacted logs. Do not include credentials, URLs with tokens, prompts, or private file contents.
      render: shell
