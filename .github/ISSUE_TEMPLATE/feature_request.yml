name: Feature request
description: Suggest a focused improvement
title: "[Feature Request] "
labels: [enhancement]
body:
  - type: textarea
    id: request
    attributes:
      label: What should we add or change?
      description: Explain what you are trying to do and what outcome you want.
      placeholder: |
        I am trying to …

        It would help if PiChamber …
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Which runtime should this affect?
      options:
        - Shared UI and server
        - Desktop
        - Browser or hosted mobile
        - Capacitor mobile
        - Server or CLI
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Add links, screenshots, mockups, constraints, or alternatives you considered.
