services:
  pichamber:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pichamber
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/pichamber:/home/openchamber/.config/pichamber
      - ./data/pi/agent:/home/openchamber/.pi/agent
      - ./data/ssh:/home/openchamber/.ssh
      - ./data/workspaces:/home/openchamber/workspaces
    environment:
      # Docker binds PiChamber to 0.0.0.0 for port mapping, so UI auth is required.
      # Set this before starting, for example:
      #   OPENCHAMBER_UI_PASSWORD="$(openssl rand -base64 24)" docker compose up -d
      OPENCHAMBER_UI_PASSWORD: ${OPENCHAMBER_UI_PASSWORD:?Set OPENCHAMBER_UI_PASSWORD before exposing PiChamber through Docker}
    # OPENCHAMBER_HOST: 0.0.0.0  # Bind address (default in Docker entrypoint: 0.0.0.0)
    # OPENCHAMBER_TUNNEL_PROVIDER: cloudflare
    # OPENCHAMBER_TUNNEL_MODE: quick  # quick | managed-remote | managed-local
    # OPENCHAMBER_TUNNEL_HOSTNAME: app.example.com  # required for managed-remote
    # OPENCHAMBER_TUNNEL_TOKEN: your_cloudflare_token  # required for managed-remote
    # OPENCHAMBER_TUNNEL_CONFIG: /home/openchamber/.cloudflared/config.yml  # optional for managed-local
    restart: unless-stopped
